<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Wire the Google Apps Script bridge so the React app can call
    // server-side functions via __MAGISTRAT_GOOGLE_BRIDGE__.
    window.__MAGISTRAT_GOOGLE_BRIDGE__ = {
      // These two are called synchronously by the provider factory —
      // return plain objects, no server round-trip needed.
      getHostInfo: function () {
        return {
          host: "google_slides",
          platform: "web",
          documentId: undefined
        };
      },
      getCapabilities: function () {
        return {
          readDeckSnapshot: true,
          applyPatchOps: true,
          selectObject: false,
          documentStateCarrier: true,
          revisionGuard: false
        };
      },
      readPresentation: function () {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .readPresentation();
        });
      },
      applyMutations: function (mutations, options) {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .applyMutations(mutations, options);
        });
      },
      getDocumentCarrier: function () {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .getDocumentCarrier();
        });
      },
      setDocumentCarrier: function (content) {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .setDocumentCarrier(content);
        });
      },
      readMasterLayouts: function () {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .readMasterLayouts();
        });
      },
      applyMasterPatches: function (requests) {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .applyMasterPatches(requests);
        });
      },
    };
  </script>

  <!-- INJECT_VITE_BUNDLE -->
  <!-- The deploy script replaces this comment with the inlined Vite build output -->
</body>
</html>
